name: Build DenizCraft APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate Gradle project root
        id: locate
        shell: bash
        run: |
          echo "=== Repository files ==="
          ls -la
          SETTINGS_FILE="$(find . -maxdepth 3 \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1 || true)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Depoda settings.gradle.kts bulunamadi! Lutfen once AI Studio -> Github uzerinden proje dosyalarini bu depoya/branch'e gonderdiginizden emin olun."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle root at: $PROJECT_DIR"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_DIR/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_DIR/licenses/android-sdk-preview-license"
          SDKMGR="$(find "$SDK_DIR" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            echo "Decoding project debug.keystore.base64 (matches Firebase SHA-1)..."
            tr -d '\r' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "::warning::debug.keystore.base64 bulunamadi! Yeni rastgele keystore olusturuluyor; SHA-1 Firebase ile eslesmezse Google girisi iptal edildi hatasi verir."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "=== APK Debug SHA-1 ==="
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep -E "SHA1:|SHA256:" || true

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact file
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DenizCraft.apk"

      - name: Upload DenizCraft APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DenizCraft-APK
          path: DenizCraft.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (latest)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: DenizCraft Latest APK
          body: "DenizCraft (Fight and Build) otomatik GitHub Actions APK derlemesi."
          files: DenizCraft.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
